# CapsuleTODO CI（V0.2.0.0 后起草，随下版本入库生效）
# 门禁云端化：本地七项门禁（fmt/clippy/test/doc/vue-tsc/build）推送到 GitHub 自动跑，
# 红了立即暴露回归；README 挂动态徽章为信任信号。
# 跑在 windows-latest——托盘/热键/吸附等 cfg(windows) 模块的测试只有 Windows 跑得全
#（macOS/Linux 适配启动后再扩矩阵 runner）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # cargo 编译产物缓存（首次 ~6min，缓存命中后 ~3min）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: npm ci
        run: npm ci

      # 前端产物必须先建：generate_context! 宏在编译期读取 frontendDist(../dist)，
      # 本地 dist 常在从未暴露，云端无产物则 clippy/test 直接 panic（首跑实证）
      - name: 前端类型检查与构建（vue-tsc + vite，产出 dist/）
        run: npm run build

      - name: 前端测试
        run: npm test

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: core

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: core

      - name: cargo clippy（dev-diag）
        run: cargo clippy --all-targets --features dev-diag -- -D warnings
        working-directory: core

      - name: cargo test
        run: cargo test
        working-directory: core

      - name: cargo test（dev-diag feature）
        run: cargo test --features dev-diag
        working-directory: core

      - name: cargo doc（broken link 检查）
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
        working-directory: core

      # FIX014.38：诊断前端是独立 mode，必须单独构建一次，避免 __DIAG__ 分支只在本地验过。
      - name: 前端诊断构建
        run: npm run build:diag

      - name: prettier 格式检查
        run: npx prettier --check AGENTS.md README.md x.progress.md z.plan.md package.json vite.config.ts vitest.config.ts .github/workflows/ci.yml scripts/tauri.mjs "ui/**/*.{ts,vue,css}"
