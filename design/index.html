<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapsuleTODO — design 实验场（基准配方）</title>
    <link rel="stylesheet" href="glass.css" />
    <style>
      /* ===== 组件样式（1:1 对照 APP：TodoList/AddBar/BubblesView/WhiteboardView） ===== */
      /* hidden 兜底：.page/.group 等设了 display 的元素，hidden 会被覆盖导致切页失效 */
      [hidden] {
        display: none !important;
      }

      /* 纵向布局：玻璃板居中在上，实验场控件同宽置下（按钮单行排布压低面板） */
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 48px;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .topbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.3px;
        opacity: 0.8;
      }

      /* 页签：uiverse heavy-dragonfly-92 改造（RESEARCH R001 引入规范——令牌化/重排尺寸/红色徽章/reduced-motion 守卫） */
      .tabs {
        display: flex;
        position: relative;
        flex-shrink: 0;
        width: 100%;
        background-color: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 玻璃板落影（REC 配方推广） */
        padding: 0.75rem;
        border-radius: 99px;
        box-sizing: border-box;
      }

      .tabs * {
        z-index: 2;
      }

      .tabs input[type="radio"] {
        display: none;
      }

      .tab {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        height: 30px;
        width: 80px; /* 三页签平分板内宽：(300-36-24)/3 */
        font-size: 0.8rem;
        color: var(--ink);
        font-weight: 500;
        border-radius: 99px;
        cursor: pointer;
        transition: color 0.15s ease-in;
      }

      /* 气泡徽章：红色固定正圆（用户定案），≥10 显示"9+"保持圆形 */
      .notification {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: -4px;
        right: 8px;
        width: 1rem;
        height: 1rem;
        font-size: 10px;
        line-height: 1; /* 行盒收紧到字面高，数字随 flex 真居中（用户定案） */
        border-radius: 50%;
        background-color: var(--danger);
        color: #fff;
        transition: 0.15s ease-in;
      }

      .tabs input[type="radio"]:checked + .tab {
        color: var(--accent);
      }

      .tabs input[id="radio-1"]:checked ~ .glider {
        transform: translateX(0);
      }

      .tabs input[id="radio-2"]:checked ~ .glider {
        transform: translateX(100%);
      }

      .tabs input[id="radio-3"]:checked ~ .glider {
        transform: translateX(200%);
      }

      .glider {
        position: absolute;
        display: flex;
        height: 30px;
        width: 80px;
        background-color: var(--glider-bg);
        box-shadow: 0 0 12px var(--glider-glow); /* 同色辉光（用户定案，配方沿输入框聚焦辉光） */
        z-index: 1;
        border-radius: 99px;
        transition: 0.25s ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .glider,
        .tab,
        .input {
          transition: none;
        }

        /* 霓虹勾选框：动效全关（粒子/流光/爆闪 + 对勾描画），勾选态瞬时呈现 */
        .neon-checkbox,
        .neon-checkbox * {
          animation: none;
          transition: none;
        }

        /* 删除按钮：展宽/图标位移/文字滑入全部瞬时 */
        .del,
        .del::before,
        .del-icon {
          transition: none;
        }

        /* 添加按钮（REC）：按压位移/落影变化瞬时 */
        .btn-add,
        .btn-add-face {
          transition: none;
        }
      }

      .page {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        min-height: 0;
        flex: 1;
      }

      /* 添加行（AddBar） */
      .addbar .row {
        display: flex;
        gap: 6px;
      }

      /* 输入框：uiverse plastic-parrot-88 改造（聚焦环改主题 accent 色 + 底色与面板统一 + 正常字体——用户定案） */
      .input {
        flex: 1;
        min-width: 0;
        height: 22px; /* 用户定案（原≈24px 的四分之三为 18px，现定 22px） */
        padding: 0 16px; /* px-4；高度改定值后垂直居中靠 height */
        border: none;
        outline: none;
        border-radius: 9999px; /* rounded-full 胶囊端头（是否收窄待用户定） */
        background-color: var(--panel-bg); /* 与其他面板统一 */
        color: var(--ink);
        font: inherit; /* 正常字体（弃 mono，用户定案） */
        font-size: 13px;
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 与其他面板统一（含落影） */
        transition:
          box-shadow 300ms ease,
          background-color 300ms ease; /* duration-300 */
      }

      .input:focus {
        box-shadow:
          var(--panel-stroke),
          0 0 0 2px var(--input-focus-ring),
          0 10px 15px -3px var(--input-focus-glow),
          0 4px 6px -4px var(--input-focus-glow); /* 聚焦：主题色环 + 柔光 */
      }

      .input::placeholder {
        color: var(--ink-2);
        opacity: 0.75;
      }

      /* 添加按钮：uiverse average-swan-99（Praashoo7，Teenage Engineering EP-133 按钮组）源码直引
         ——只取 record 红钮（.button3）+ 外黑方（.btn）；颜色/阴影/圆角/过渡均为源码值（用户要求 100% 表达，未令牌化）；
         仅三处用户定制：外黑圆角与内红一致（10px，源码 5px）、REC 居中（源码 flex-start + padding-top）、
         组件落影距离减半（10px→5px）；em 几何经 font-size 缩放（6px → 红钮 34.2px 方，源码 1em=16px → 91px） */
      .btn-add {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        /* 黑方随输入框 22px 同高（50% 黑透）；圆角随高度 5→6px */
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background-color: var(--rec-frame); /* 外框底：panel-bg 加深一倍（用户定案） */
        /* 组件落影以外框为标定（用户定案，前值挂在红方上）；大小减半：3.3px/8px → 1.7px/4px，深度不变 */
        box-shadow: rgba(0, 0, 0, 0.566) 1.7px 1.7px 4px;
        font-size: 6px; /* 缩放旋钮（红钮已改 px 定值，仅 em 文字间距仍在用） */
        cursor: pointer;
      }

      .btn-add:active {
        /* 按压塌影（塌小塌淡，用户定案）：落影减半但轮廓始终在，玻璃板不融进亮背景 */
        box-shadow: rgba(0, 0, 0, 0.28) 0.9px 0.9px 2px;
      }

      .btn-add-face {
        display: flex;
        align-items: center; /* REC 居中（源码 flex-start） */
        justify-content: center;
        width: 18px; /* 黑方 22px − 2px 黑边×2 */
        height: 18px;
        border: none;
        outline: none;
        border-radius: 4px; /* 随高度 18/14 ≈ 4→5px 档 */
        background-color: #d42a02;
        /* 常态零阴影（用户定案：单纯红色），落影已移至外框 */
        cursor: pointer;
        transition: 0.1s ease-in-out;
      }

      .btn-add-text {
        color: white;
        font-family: Montserrat, sans-serif;
        font-size: 6px; /* 用户定案 */
        letter-spacing: 0.075em;
      }

      .btn-add:active .btn-add-face {
        /* 按下仅保留黑色内阴影（用户定案），深度 50% 透明（用户定案：压红底呈深一档红，非死黑） */
        box-shadow: inset 0.5px 0.5px 4px rgba(0, 0, 0, 0.5);
      }

      .btn-add:active .btn-add-text {
        transform: translateY(0.5px);
      }

      /* 清单行（TodoList） */
      .group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* 虚拟外框（用户定案公式）：不设宽 + 左右负外边距各拉出 8px → 框距卡边恒 10px、
           框宽 = 卡宽 − 20 随卡片动态；内边距 8px → 行宽 = 框宽 − 16，与其他玻璃面板等宽对齐；
           顶边 -4px（抵消内边距 8px 后再整体下移 4px，用户定案），底部随内容 */
        margin: -4px -8px 0;
        padding: 8px; /* 组内边距（用户定案 8px）：左/右/上 8px，末行之后亦 8px */
        list-style: none;
        overflow-y: auto;
      }

      .todo-row {
        position: relative; /* 删除按钮右缘锚定基准（悬停向左展开、覆盖文字） */
        display: flex;
        align-items: center;
        gap: 10px;
        /* 霓虹勾选框装饰层（环/粒子）伸出行外且未勾选态也常驻（opacity:0 仍占滚动区），
           会给下方 overflow-y:auto 的分组容器制造 ~40px 幻影滚动区——裁剪回行界 */
        overflow: clip;
        padding: 9px 12px;
        border-radius: var(--radius-panel);
        background: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 玻璃板落影（REC 配方推广） */
        cursor: pointer;
      }

      /* 勾选框：uiverse hot-dragonfly-56（00Kubi，纯 CSS，R001 规范改造）
         颜色令牌化（glass.css --check-*）；原型交互 = 整行点击驱动，
         组件 pointer-events 关闭、input 仅作视觉状态位（勾选由 JS 置位后播过渡） */
      .neon-checkbox {
        --primary: var(--check-primary);
        --primary-dark: var(--check-primary-dark);
        --size: 20px; /* 原型行高适配（组件默认 30px） */
        position: relative;
        flex-shrink: 0;
        width: var(--size);
        height: var(--size);
        pointer-events: none;
        -webkit-tap-highlight-color: transparent;
      }

      .neon-checkbox input {
        display: none;
      }

      .neon-checkbox__frame {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .neon-checkbox__box {
        position: absolute;
        inset: 0;
        background: var(--check-box-bg);
        border-radius: 4px;
        border: 2px solid var(--primary-dark);
        transition: all 0.4s ease;
      }

      .neon-checkbox__check-container {
        position: absolute;
        inset: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .neon-checkbox__check {
        width: 80%;
        height: 80%;
        fill: none;
        stroke: var(--primary);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        transform-origin: center;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .neon-checkbox__glow {
        position: absolute;
        inset: -2px;
        border-radius: 6px;
        background: var(--primary);
        opacity: 0;
        filter: blur(8px);
        transform: scale(1.2);
        transition: all 0.4s ease;
      }

      .neon-checkbox__borders {
        position: absolute;
        inset: 0;
        border-radius: 4px;
        overflow: hidden;
      }

      .neon-checkbox__borders span {
        position: absolute;
        width: 40px;
        height: 1px;
        background: var(--primary);
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .neon-checkbox__borders span:nth-child(1) {
        top: 0;
        left: -100%;
        animation: borderFlow1 2s linear infinite;
      }

      .neon-checkbox__borders span:nth-child(2) {
        top: -100%;
        right: 0;
        width: 1px;
        height: 40px;
        animation: borderFlow2 2s linear infinite;
      }

      .neon-checkbox__borders span:nth-child(3) {
        bottom: 0;
        right: -100%;
        animation: borderFlow3 2s linear infinite;
      }

      .neon-checkbox__borders span:nth-child(4) {
        bottom: -100%;
        left: 0;
        width: 1px;
        height: 40px;
        animation: borderFlow4 2s linear infinite;
      }

      .neon-checkbox__particles span {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--primary);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        top: 50%;
        left: 50%;
        box-shadow: 0 0 6px var(--primary);
      }

      .neon-checkbox__rings {
        position: absolute;
        inset: -20px;
        pointer-events: none;
      }

      .neon-checkbox__rings .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid var(--primary);
        opacity: 0;
        transform: scale(0);
      }

      .neon-checkbox__sparks span {
        position: absolute;
        width: 20px;
        height: 1px;
        background: linear-gradient(90deg, var(--primary), transparent);
        opacity: 0;
      }

      /* 悬停态（原型整行点击驱动 + pointer-events 关闭，此态不触发，保留组件原样） */
      .neon-checkbox:hover .neon-checkbox__box {
        border-color: var(--primary);
        transform: scale(1.05);
      }

      /* 勾选态 */
      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__box {
        border-color: var(--primary);
        background: var(--check-box-bg-checked);
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__check {
        stroke-dashoffset: 0;
        transform: scale(1.1);
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__glow {
        opacity: 0.2;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__borders span {
        opacity: 1;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__particles span {
        animation: particleExplosion 0.6s ease-out forwards;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__rings .ring {
        animation: ringPulse 0.6s ease-out forwards;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__sparks span {
        animation: sparkFlash 0.6s ease-out forwards;
      }

      @keyframes borderFlow1 {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(200%);
        }
      }

      @keyframes borderFlow2 {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(200%);
        }
      }

      @keyframes borderFlow3 {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-200%);
        }
      }

      @keyframes borderFlow4 {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-200%);
        }
      }

      @keyframes particleExplosion {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--x, 20px)), calc(-50% + var(--y, 20px))) scale(0);
          opacity: 0;
        }
      }

      @keyframes ringPulse {
        0% {
          transform: scale(0);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @keyframes sparkFlash {
        0% {
          transform: rotate(var(--r, 0deg)) translateX(0) scale(1);
          opacity: 1;
        }
        100% {
          transform: rotate(var(--r, 0deg)) translateX(30px) scale(0);
          opacity: 0;
        }
      }

      .neon-checkbox__particles span:nth-child(1) {
        --x: 25px;
        --y: -25px;
      }
      .neon-checkbox__particles span:nth-child(2) {
        --x: -25px;
        --y: -25px;
      }
      .neon-checkbox__particles span:nth-child(3) {
        --x: 25px;
        --y: 25px;
      }
      .neon-checkbox__particles span:nth-child(4) {
        --x: -25px;
        --y: 25px;
      }
      .neon-checkbox__particles span:nth-child(5) {
        --x: 35px;
        --y: 0px;
      }
      .neon-checkbox__particles span:nth-child(6) {
        --x: -35px;
        --y: 0px;
      }
      .neon-checkbox__particles span:nth-child(7) {
        --x: 0px;
        --y: 35px;
      }
      .neon-checkbox__particles span:nth-child(8) {
        --x: 0px;
        --y: -35px;
      }
      .neon-checkbox__particles span:nth-child(9) {
        --x: 20px;
        --y: -30px;
      }
      .neon-checkbox__particles span:nth-child(10) {
        --x: -20px;
        --y: 30px;
      }
      .neon-checkbox__particles span:nth-child(11) {
        --x: 30px;
        --y: 20px;
      }
      .neon-checkbox__particles span:nth-child(12) {
        --x: -30px;
        --y: -20px;
      }

      .neon-checkbox__sparks span:nth-child(1) {
        --r: 0deg;
        top: 50%;
        left: 50%;
      }
      .neon-checkbox__sparks span:nth-child(2) {
        --r: 90deg;
        top: 50%;
        left: 50%;
      }
      .neon-checkbox__sparks span:nth-child(3) {
        --r: 180deg;
        top: 50%;
        left: 50%;
      }
      .neon-checkbox__sparks span:nth-child(4) {
        --r: 270deg;
        top: 50%;
        left: 50%;
      }

      .neon-checkbox__rings .ring:nth-child(1) {
        animation-delay: 0s;
      }
      .neon-checkbox__rings .ring:nth-child(2) {
        animation-delay: 0.1s;
      }
      .neon-checkbox__rings .ring:nth-child(3) {
        animation-delay: 0.2s;
      }

      .t-text {
        flex: 1;
        /* 右侧预留收起态删除按钮位（25px，收起左缘距行右缘 36px）；悬停展开时按钮再覆盖上来 */
        padding-right: 36px;
        font-size: 13.5px;
        line-height: 1.35;
        word-break: break-word;
      }

      .is-done .t-text {
        text-decoration: line-through;
        opacity: 0.55;
      }

      /* 删除按钮：uiverse smart-emu-83 改造（R001 规范，类名隔离 .del/.del-icon）
         实底改 25% 透明黑（用户定案）；整套按组件 0.5 等比缩放（25px，用户定案：原组件的一半）；
       中心缩放：收起位 right:11px（圆心 23.5px），悬停展宽向两侧各涨 5px——translateX(+5px)
       补偿右缘锚定，展开后右缘落回 right:6px（用户定案 ②） */
      .del {
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        transform: translateY(-50%);
        z-index: 1;
        display: flex;
        width: 25px;
        height: 25px;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 50%;
        background-color: rgba(0, 0, 0, 0.25);
        font-weight: 600;
        cursor: pointer;
        transition-duration: 0.3s;
        overflow: hidden;
      }

      .del-icon {
        width: 6px;
        transition-duration: 0.3s;
      }

      .del-icon path {
        fill: #fff;
      }

      .del:hover {
        width: 35px;
        transform: translateY(-50%) translateX(5px);
        border-radius: 50px;
        background-color: rgb(255, 69, 69);
        /* 红辉光：分层与浓度参数抄 input 聚焦紫辉光（--del-hover-glow） */
        box-shadow:
          0 10px 15px -3px var(--del-hover-glow),
          0 4px 6px -4px var(--del-hover-glow);
      }

      .del:hover .del-icon {
        width: 25px;
        transform: translateY(60%);
      }

      .del::before {
        position: absolute;
        top: -10px;
        content: "Delete";
        color: #fff;
        font-size: 2px;
        transition-duration: 0.3s;
      }

      .del:hover::before {
        font-size: 6.5px;
        opacity: 1;
        transform: translateY(15px);
        transition-duration: 0.3s;
      }

      .done-head {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 4px;
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        opacity: 0.6;
        cursor: pointer;
      }

      .empty,
      .placeholder {
        margin: 24px 0;
        font-size: 13px;
        text-align: center;
        opacity: 0.55;
      }

      /* 气泡页（BubblesView） */
      .actions {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 8px;
      }

      .capture {
        flex: 1;
        padding: 8px 0;
        border: none;
        border-radius: var(--radius-panel);
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .copied {
        flex-shrink: 0;
        font-size: 12px;
        opacity: 0.7;
      }

      .error {
        margin: 0;
        font-size: 12px;
        color: var(--danger);
      }

      .banner {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        border-radius: var(--radius-panel);
        background: rgba(230, 170, 0, 0.15);
        font-size: 12.5px;
      }

      .clear {
        flex-shrink: 0;
        padding: 4px 10px;
        border: none;
        border-radius: 8px;
        background: rgba(229, 72, 77, 0.15);
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .clear.confirming {
        background: var(--danger);
        color: #fff;
      }

      .bubble-row {
        position: relative; /* 删除按钮右缘锚定基准（.del 绝对定位的宿主要求，与 .todo-row 同款） */
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: var(--radius-panel);
        background: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 玻璃板落影（REC 配方推广） */
        cursor: pointer;
      }

      .b-text {
        flex: 1;
        /* 右侧预留收起态删除按钮位（收起左缘距行右缘 36px，与 .t-text 同款）；悬停展开时按钮覆盖上来 */
        padding-right: 36px;
        font-size: 13px;
        line-height: 1.35;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* 白板页（WhiteboardView） */
      .board {
        flex: 1;
        min-height: 0;
        padding: 10px 12px;
        border: none;
        border-radius: var(--radius-panel);
        background: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow);
        color: inherit;
        font: inherit;
        font-size: 13px;
        line-height: 1.5;
        resize: none;
        outline: none;
        word-break: break-word;
      }

      .board::placeholder {
        color: var(--ink-2);
      }

      .status {
        margin: 0;
        font-size: 12px;
        opacity: 0.55;
      }

      /* 实验场控件（design/ 专属，不映射 APP） */
      /* 实验场控件（design/ 专属，不映射 APP）：与玻璃板同宽，置于板下 */
      .lab {
        width: 300px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 12.5px;
        line-height: 1.6;
        backdrop-filter: blur(8px);
      }

      .lab h2 {
        margin: 0 0 8px;
        font-size: 13px;
      }

      /* 分支版本定位（用户定案：标题后空开几格） */
      .branch-ver {
        margin-left: 16px;
        font-size: 10.5px;
        opacity: 0.65;
      }

      /* 四按钮单行排布（flex 平分），压低面板高度 */
      .btnrow {
        display: flex;
        gap: 4px;
        margin: 4px 0;
      }

      .lab button {
        flex: 1;
        min-width: 0;
        padding: 5px 2px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: inherit;
        font-size: 11px;
        white-space: nowrap;
        text-align: center;
        cursor: pointer;
      }

      /* 主题按钮独占下一行（其余四钮单行排布） */
      #lab-theme {
        display: block;
        width: 100%;
        margin-top: 6px;
      }

      .lab button:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .lab .tip {
        margin: 8px 0 0;
        font-size: 11px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body data-bg="cafe">
    <div class="stage">
      <main class="glass-card" id="board">
        <header class="topbar">
          <h1 class="title">CapsuleTODO</h1>
        </header>
        <nav class="tabs">
          <input type="radio" id="radio-1" name="tabs" data-page="todos" checked />
          <label for="radio-1" class="tab">清单</label>
          <input type="radio" id="radio-2" name="tabs" data-page="bubbles" />
          <label for="radio-2" class="tab"
            >气泡<span id="bubble-badge" class="notification" hidden>0</span></label
          >
          <input type="radio" id="radio-3" name="tabs" data-page="whiteboard" />
          <label for="radio-3" class="tab">白板</label>
          <span class="glider"></span>
        </nav>

        <!-- 清单页 -->
        <div class="page" id="page-todos">
          <div class="addbar">
            <div class="row">
              <input id="todo-input" class="input" type="text" placeholder="添加一条待办…" />
              <button id="todo-add" class="btn-add" disabled>
                <span class="btn-add-face"><span class="btn-add-text">REC</span></span>
              </button>
            </div>
          </div>
          <p id="todo-empty" class="empty" hidden>暂无待办，添加一条吧</p>
          <ul id="todo-active" class="group"></ul>
          <div id="todo-done-wrap" hidden>
            <button id="todo-done-head" class="done-head">
              <span id="todo-done-caret">▸</span> 已完成 <span id="todo-done-count">0</span>
            </button>
            <ul id="todo-done" class="group" hidden></ul>
          </div>
        </div>

        <!-- 气泡页 -->
        <div class="page" id="page-bubbles" hidden>
          <div class="actions">
            <button id="bubble-capture" class="capture">⧉ 捕获剪贴板</button>
            <span id="bubble-copied" class="copied" hidden>已复制到剪贴板</span>
          </div>
          <p id="bubble-error" class="error" hidden></p>
          <div id="bubble-banner" class="banner" hidden>
            <span>气泡已满 5 个，该清理了</span>
            <button id="bubble-clear" class="clear">一键清空</button>
          </div>
          <p id="bubble-empty" class="empty">暂无气泡，点上方捕获剪贴板</p>
          <ul id="bubble-list" class="group"></ul>
        </div>

        <!-- 白板页 -->
        <div class="page" id="page-whiteboard" hidden>
          <textarea
            id="wb-board"
            class="board"
            placeholder="随手记点什么…"
            spellcheck="false"
          ></textarea>
          <p id="wb-status" class="status" hidden></p>
        </div>
      </main>

      <!-- 实验场控件（design/ 专属，不映射 APP） -->
      <aside class="lab">
        <h2>实验场控件<span class="branch-ver">ui1.0 V0.001</span></h2>
        <div class="btnrow">
          <button data-bg="cafe">咖啡背景</button>
          <button data-bg="sunset">日落背景</button>
          <button id="lab-focus">聚焦预览：关</button>
          <button id="lab-seed">注入示例</button>
        </div>
        <button id="lab-theme">主题：跟随系统</button>
        <p class="tip">
          基准配方 = 现行 APP（V0.1.1.1）。调参改 glass.css 令牌；聚焦态预览为 backdrop 近似（真窗口
          = DWM Acrylic，见 README 可行性标注）。定稿后按映射表落回 ui/（后续单独 PL）。
        </p>
      </aside>
    </div>

    <script>
      // ===== 客户端模拟状态（实验场专用：无 Tauri 无持久化，演示捕获 = 示例片段池） =====
      let todoSeq = 0;
      const todos = [
        { id: ++todoSeq, text: "买牛奶", done: false },
        { id: ++todoSeq, text: "写周报", done: false },
        { id: ++todoSeq, text: "读一章 Rust 书", done: false },
        { id: ++todoSeq, text: "给 CapsuleTODO 画个图标", done: true },
      ];
      let bubbleSeq = 0;
      const bubbles = [
        { id: ++bubbleSeq, text: "示例片段：把设计实验场的配方读数抄回 glass.css" },
        { id: ++bubbleSeq, text: "示例片段：uiverse 动效候选 R001-5 成功对勾曲线" },
      ];
      const SAMPLE_SNIPPETS = [
        "示例片段：随手复制的一段网址 https://example.com/design-lab",
        "示例片段：临时记一下——明早把白板草稿誊进待办",
        "示例片段： conferences 关键词清单，稍后整理",
      ];
      const MAX_BUBBLES = 5; // 与 APP 常量一致（满 5 提醒）
      let doneOpen = false;
      let confirmingClear = false;
      let confirmTimer = 0;
      let copiedTimer = 0;
      let wbTimer = 0;
      let wbSaved = "";
      let snippetIdx = 0;

      const $ = (id) => document.getElementById(id);

      // ===== 页签（uiverse glider 组件：radio 驱动滑块，change 同步页面显隐） =====
      document.querySelectorAll('.tabs input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          for (const page of ["todos", "bubbles", "whiteboard"]) {
            $(`page-${page}`).hidden = page !== radio.dataset.page;
          }
        });
      });

      // ===== 清单（勾选/增删/折叠） =====
      function renderTodos() {
        const active = todos.filter((t) => !t.done);
        const done = todos.filter((t) => t.done);
        const row = (t) => `
          <li class="todo-row ${t.done ? "is-done" : ""}" data-id="${t.id}">
            <div class="neon-checkbox" aria-hidden="true">
              <input type="checkbox" tabindex="-1" ${t.done ? "checked" : ""} />
              <div class="neon-checkbox__frame">
                <div class="neon-checkbox__box">
                  <div class="neon-checkbox__check-container">
                    <svg class="neon-checkbox__check" viewBox="0 0 24 24">
                      <path d="M5 12l5 5L20 7"></path>
                    </svg>
                  </div>
                  <div class="neon-checkbox__glow"></div>
                  <div class="neon-checkbox__borders">
                    <span></span><span></span><span></span><span></span>
                  </div>
                </div>
                <div class="neon-checkbox__particles">
                  <span></span><span></span><span></span><span></span><span></span><span></span
                  ><span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="neon-checkbox__rings">
                  <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                </div>
                <div class="neon-checkbox__sparks">
                  <span></span><span></span><span></span><span></span>
                </div>
              </div>
            </div>
            <span class="t-text">${t.text}</span>
            <button class="del" data-del="${t.id}" aria-label="删除">
              <svg class="del-icon" viewBox="0 0 448 512">
                <path
                  d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.4 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"
                ></path>
              </svg>
            </button>
          </li>`;
        $("todo-active").innerHTML = active.map(row).join("");
        $("todo-done").innerHTML = done.map(row).join("");
        updateTodoChrome(done.length);
      }

      // 折叠头/空态/计数等外壳状态（全量渲染与勾选就地归组共用）
      function updateTodoChrome(doneCount) {
        $("todo-empty").hidden = todos.length > 0;
        $("todo-active").hidden = todos.length === 0;
        $("todo-done-wrap").hidden = doneCount === 0;
        $("todo-done").hidden = !doneOpen;
        $("todo-done-count").textContent = String(doneCount);
        $("todo-done-caret").textContent = doneOpen ? "▾" : "▸";
      }

      $("todo-add").addEventListener("click", addTodo);
      $("todo-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTodo();
      });
      $("todo-input").addEventListener("input", (e) => {
        $("todo-add").disabled = e.target.value.trim().length === 0;
      });

      function addTodo() {
        const text = $("todo-input").value.trim();
        if (!text) return;
        todos.push({ id: ++todoSeq, text, done: false });
        $("todo-input").value = "";
        $("todo-add").disabled = true;
        renderTodos();
      }

      document.addEventListener("click", (e) => {
        const del = e.target.closest("[data-del]");
        if (del) {
          const id = Number(del.dataset.del);
          // 先查气泡再查清单：两类行共用 data-del 删除通道，命中谁删谁
          const bi = bubbles.findIndex((x) => x.id === id);
          if (bi >= 0) {
            bubbles.splice(bi, 1);
            renderBubbles();
            return;
          }
          const idx = todos.findIndex((t) => t.id === id);
          if (idx >= 0) todos.splice(idx, 1);
          renderTodos();
          return;
        }
        const row = e.target.closest(".todo-row");
        if (row) {
          const t = todos.find((x) => x.id === Number(row.dataset.id));
          if (t) {
            t.done = !t.done;
            // 勾选动效就地播放（组件靠 :checked 过渡，整页重渲染会打断），播完再归入对应分组
            row.querySelector(".neon-checkbox input").checked = t.done;
            row.classList.toggle("is-done", t.done);
            clearTimeout(row._moveTimer);
            row._moveTimer = setTimeout(() => {
              // 全量重渲染/删除会换掉节点，已脱离文档则跳过
              if (row.isConnected) {
                (t.done ? $("todo-done") : $("todo-active")).appendChild(row);
                updateTodoChrome(todos.filter((x) => x.done).length);
              }
            }, 600);
          }
          return;
        }
        const brow = e.target.closest(".bubble-row");
        if (brow) {
          // 复制回剪贴板（实验场尽力而为：非 https 环境可能被拒，观感不受影响）
          const b = bubbles.find((x) => x.id === Number(brow.dataset.id));
          if (b && navigator.clipboard) {
            navigator.clipboard.writeText(b.text).catch(() => {});
          }
          showCopied();
        }
      });

      $("todo-done-head").addEventListener("click", () => {
        doneOpen = !doneOpen;
        renderTodos();
      });

      // ===== 气泡（捕获/复制回/删除/满 5 横幅/二态清空） =====
      function renderBubbles() {
        $("bubble-list").innerHTML = bubbles
          .map(
            (b) => `
          <li class="bubble-row" data-id="${b.id}">
            <span class="b-text">${b.text}</span>
            <button class="del" data-del="${b.id}" aria-label="删除">
              <svg class="del-icon" viewBox="0 0 448 512">
                <path
                  d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.4 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"
                ></path>
              </svg>
            </button>
          </li>`,
          )
          .join("");
        $("bubble-empty").hidden = bubbles.length > 0;
        $("bubble-list").hidden = bubbles.length === 0;
        $("bubble-banner").hidden = bubbles.length < MAX_BUBBLES;
        // 页签红色徽章：读实际气泡数，固定正圆，≥10 显示"9+"（用户定案）
        $("bubble-badge").textContent = bubbles.length > 9 ? "9+" : String(bubbles.length);
        $("bubble-badge").hidden = bubbles.length === 0;
      }

      function showCopied() {
        $("bubble-copied").hidden = false;
        window.clearTimeout(copiedTimer);
        copiedTimer = window.setTimeout(() => {
          $("bubble-copied").hidden = true;
        }, 2000);
      }

      // 演示捕获：示例片段池轮转（真实剪贴板链路属 APP，实验场只管观感）
      $("bubble-capture").addEventListener("click", () => {
        bubbles.unshift({
          id: ++bubbleSeq,
          text: SAMPLE_SNIPPETS[snippetIdx % SAMPLE_SNIPPETS.length],
        });
        snippetIdx += 1;
        renderBubbles();
      });

      $("bubble-clear").addEventListener("click", () => {
        // 二态确认：首点变红"确认清空 N 条？"再点执行，3 秒未点复位
        if (!confirmingClear) {
          confirmingClear = true;
          $("bubble-clear").textContent = `确认清空 ${bubbles.length} 条？`;
          $("bubble-clear").classList.add("confirming");
          window.clearTimeout(confirmTimer);
          confirmTimer = window.setTimeout(() => {
            confirmingClear = false;
            $("bubble-clear").textContent = "一键清空";
            $("bubble-clear").classList.remove("confirming");
          }, 3000);
          return;
        }
        window.clearTimeout(confirmTimer);
        confirmingClear = false;
        $("bubble-clear").textContent = "一键清空";
        $("bubble-clear").classList.remove("confirming");
        bubbles.length = 0;
        renderBubbles();
      });

      $("lab-seed").addEventListener("click", () => {
        bubbles.unshift({
          id: ++bubbleSeq,
          text: SAMPLE_SNIPPETS[snippetIdx % SAMPLE_SNIPPETS.length],
        });
        snippetIdx += 1;
        renderBubbles();
      });

      // ===== 白板（防抖自动保存状态行——实验场仅模拟状态，不落盘） =====
      $("wb-board").addEventListener("input", () => {
        if ($("wb-board").value === wbSaved) {
          $("wb-status").hidden = true;
          return;
        }
        $("wb-status").hidden = false;
        $("wb-status").textContent = "编辑中…";
        window.clearTimeout(wbTimer);
        wbTimer = window.setTimeout(() => {
          wbSaved = $("wb-board").value;
          $("wb-status").textContent = "✓ 已自动保存";
        }, 800);
      });

      // ===== 实验场控件：主题三态 / 背景切换 / 聚焦态预览 =====
      const themeStates = [
        { label: "跟随系统", value: null },
        { label: "浅色", value: "light" },
        { label: "暗色", value: "dark" },
      ];
      let themeIdx = 0;
      $("lab-theme").addEventListener("click", () => {
        themeIdx = (themeIdx + 1) % themeStates.length;
        const state = themeStates[themeIdx];
        if (state.value === null) {
          document.documentElement.removeAttribute("data-theme");
        } else {
          document.documentElement.dataset.theme = state.value;
        }
        $("lab-theme").textContent = `主题：${state.label}`;
      });

      document.querySelectorAll(".lab [data-bg]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.body.dataset.bg = btn.dataset.bg;
        });
      });

      $("lab-focus").addEventListener("click", () => {
        const on = $("board").classList.toggle("focused");
        $("lab-focus").textContent = `聚焦预览：${on ? "开" : "关"}`;
      });

      renderTodos();
      renderBubbles();
    </script>
  </body>
</html>
