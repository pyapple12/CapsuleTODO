<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapsuleTODO — design 实验场（基准配方）</title>
    <link rel="stylesheet" href="glass.css" />
    <style>
      /* ===== 组件样式（1:1 对照 APP：TodoList/AddBar/BubblesView/WhiteboardView） ===== */
      /* hidden 兜底：.page/.group 等设了 display 的元素，hidden 会被覆盖导致切页失效 */
      [hidden] {
        display: none !important;
      }

      /* 纵向布局：玻璃板居中在上，实验场控件同宽置下（按钮单行排布压低面板） */
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 24px 48px 48px; /* 顶边减半：标题上方留空减半（用户定案） */
        min-height: 100vh;
        box-sizing: border-box;
      }

      .topbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center; /* 标题居中（用户定案） */
        margin-bottom: 15.5px; /* 墨迹底 → 页签 18px（盒底 48 + 15.5 = 页签顶 63.5，墨迹底≈45.5，用户定案） */
      }

      .title {
        position: relative; /* 粒子画布定位基准 */
        margin: 0;
        font-size: 30px; /* 放大一倍（原 15px，用户定案） */
        line-height: 1; /* 盒高=字高：排版内衬清零，墨迹顶≈盒顶（用户定案） */
        font-weight: 700; /* 加粗（用户定案） */
        letter-spacing: 0.3px;
        opacity: 0.8;
      }

      /* 标题粒子化（参考 Da0Mine/text-particleization，MIT）：画布接管视觉，仅粒子无双层（用户定案） */
      .title--particles {
        color: transparent; /* 由 JS 在粒子初始化时挂上；reduced-motion 不加此类，回退静态文字 */
        text-shadow: none; /* 杀掉 .glass-card 继承的字形影：透明文字仍投静态残影、钉在归位处（用户定案） */
      }

      .title-canvas {
        position: absolute;
        left: -30px; /* 画布外扩余量：粒子散开/辉光侧摆不被裁 */
        top: -20px; /* 与 MARGIN_TOP 联动：辉光上摆（模糊 15）不被裁 */
        pointer-events: none; /* 事件穿透，交互监听在 document 上 */
        /* 落影与辉光全部 canvas 内自绘（随粒子位移同步）：辉光色取 --input-focus-glow、
           落影参数取 --panel-shadow——CSS drop-shadow 无 spread 位且不随粒子动，一并淘汰 */
      }

      /* 页签：uiverse heavy-dragonfly-92 改造（RESEARCH R001 引入规范——令牌化/重排尺寸/红色徽章/reduced-motion 守卫） */
      .tabs {
        display: flex;
        position: relative;
        flex-shrink: 0;
        width: 100%;
        background-color: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 玻璃板落影（REC 配方推广） */
        padding: 0.75rem;
        margin-bottom: 10px; /* 页签 → 内容区 10px（用户定案） */
        border-radius: 99px;
        box-sizing: border-box;
      }

      .tabs * {
        z-index: 2;
      }

      .tabs input[type="radio"] {
        display: none;
      }

      .tab {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        height: 30px;
        width: 80px; /* 三页签平分板内宽：(300-36-24)/3 */
        font-size: 0.8rem;
        color: var(--ink);
        font-weight: 500;
        border-radius: 99px;
        cursor: pointer;
        transition: color 0.15s ease-in;
      }

      /* 气泡徽章：红色固定正圆（用户定案），≥10 显示"9+"保持圆形 */
      .notification {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: -4px;
        right: 8px;
        width: 1rem;
        height: 1rem;
        font-size: 10px;
        line-height: 1; /* 行盒收紧到字面高，数字随 flex 真居中（用户定案） */
        border-radius: 50%;
        background-color: var(--danger);
        color: #fff;
        transition: 0.15s ease-in;
      }

      .tabs input[type="radio"]:checked + .tab {
        color: var(--accent);
      }

      .tabs input[id="radio-1"]:checked ~ .glider {
        transform: translateX(0);
      }

      .tabs input[id="radio-2"]:checked ~ .glider {
        transform: translateX(100%);
      }

      .tabs input[id="radio-3"]:checked ~ .glider {
        transform: translateX(200%);
      }

      .glider {
        position: absolute;
        display: flex;
        height: 30px;
        width: 80px;
        background-color: var(--glider-bg);
        box-shadow: 0 0 12px var(--glider-glow); /* 同色辉光（用户定案，配方沿输入框聚焦辉光） */
        z-index: 1;
        border-radius: 99px;
        transition: 0.25s ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .glider,
        .tab,
        .input {
          transition: none;
        }

        /* 标题粒子：reduced-motion 下画布整个不显示（JS 侧同样不初始化，保静态文字） */
        .title-canvas {
          display: none;
        }

        /* 归档板：揭示动画全关（显隐瞬时完成，动画在 .board-glass 的 transform 上） */
        #board-overlay,
        #board-overlay .board-glass {
          transition: none;
        }

        /* 霓虹勾选框：动效全关（粒子/流光/爆闪 + 对勾描画），勾选态瞬时呈现 */
        .neon-checkbox,
        .neon-checkbox * {
          animation: none;
          transition: none;
        }

        /* 删除按钮：展宽/图标位移/文字滑入全部瞬时 */
        .del,
        .del::before,
        .del-icon {
          transition: none;
        }

        /* 添加按钮（REC）：按压位移/落影变化瞬时 */
        .btn-add,
        .btn-add-face {
          transition: none;
        }
      }

      .page {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        min-height: 0;
        flex: 1;
      }

      /* 添加行（AddBar） */
      .addbar .row {
        display: flex;
        gap: 6px;
      }

      /* 输入框：uiverse plastic-parrot-88 改造（聚焦环改主题 accent 色 + 底色与面板统一 + 正常字体——用户定案） */
      .input {
        flex: 1;
        min-width: 0;
        height: 22px; /* 用户定案（原≈24px 的四分之三为 18px，现定 22px） */
        padding: 0 16px; /* px-4；高度改定值后垂直居中靠 height */
        border: none;
        outline: none;
        border-radius: 9999px; /* rounded-full 胶囊端头（是否收窄待用户定） */
        background-color: var(--panel-bg); /* 与其他面板统一 */
        color: var(--ink);
        font: inherit; /* 正常字体（弃 mono，用户定案） */
        font-size: 13px;
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 与其他面板统一（含落影） */
        transition:
          box-shadow 300ms ease,
          background-color 300ms ease; /* duration-300 */
      }

      .input:focus {
        box-shadow:
          var(--panel-stroke),
          0 0 0 2px var(--input-focus-ring),
          0 10px 15px -3px var(--input-focus-glow),
          0 4px 6px -4px var(--input-focus-glow); /* 聚焦：主题色环 + 柔光 */
      }

      .input::placeholder {
        color: var(--ink-2);
        opacity: 0.75;
      }

      /* 添加按钮：uiverse average-swan-99（Praashoo7，Teenage Engineering EP-133 按钮组）源码直引
         ——只取 record 红钮（.button3）+ 外黑方（.btn）；颜色/阴影/圆角/过渡均为源码值（用户要求 100% 表达，未令牌化）；
         仅三处用户定制：外黑圆角与内红一致（10px，源码 5px）、REC 居中（源码 flex-start + padding-top）、
         组件落影距离减半（10px→5px）；em 几何经 font-size 缩放（6px → 红钮 34.2px 方，源码 1em=16px → 91px） */
      .btn-add {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        /* 黑方随输入框 22px 同高（50% 黑透）；圆角随高度 5→6px */
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background-color: var(--rec-frame); /* 外框底：panel-bg 加深一倍（用户定案） */
        /* 组件落影以外框为标定（用户定案，前值挂在红方上）；大小减半：3.3px/8px → 1.7px/4px，深度不变 */
        box-shadow: rgba(0, 0, 0, 0.566) 1.7px 1.7px 4px;
        font-size: 6px; /* 缩放旋钮（红钮已改 px 定值，仅 em 文字间距仍在用） */
        cursor: pointer;
      }

      .btn-add:active {
        /* 按压塌影（塌小塌淡，用户定案）：落影减半但轮廓始终在，玻璃板不融进亮背景 */
        box-shadow: rgba(0, 0, 0, 0.28) 0.9px 0.9px 2px;
      }

      .btn-add-face {
        display: flex;
        align-items: center; /* REC 居中（源码 flex-start） */
        justify-content: center;
        width: 18px; /* 黑方 22px − 2px 黑边×2 */
        height: 18px;
        border: none;
        outline: none;
        border-radius: 4px; /* 随高度 18/14 ≈ 4→5px 档 */
        background-color: #d42a02;
        /* 常态零阴影（用户定案：单纯红色），落影已移至外框 */
        cursor: pointer;
        transition: 0.1s ease-in-out;
      }

      .btn-add-text {
        color: white;
        font-family: Montserrat, sans-serif;
        font-size: 6px; /* 用户定案 */
        letter-spacing: 0.075em;
      }

      .btn-add:active .btn-add-face {
        /* 按下仅保留黑色内阴影（用户定案），深度 50% 透明（用户定案：压红底呈深一档红，非死黑） */
        box-shadow: inset 0.5px 0.5px 4px rgba(0, 0, 0, 0.5);
      }

      .btn-add:active .btn-add-text {
        transform: translateY(0.5px);
      }

      /* 清单行（TodoList） */
      .group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* 虚拟外框（用户定案公式）：不设宽 + 左右负外边距各拉出 8px → 框距卡边恒 10px、
           框宽 = 卡宽 − 20 随卡片动态；内边距 左右/下 8、上 4 → 行宽 = 框宽 − 16，与其他玻璃面板等宽对齐；
           顶边 -4px（用户定案整体下移 4px），底部随内容 */
        margin: -4px -8px 0;
        padding: 4px 8px 8px; /* 组内边距：上 4 → input→首行 = gap 6 + 4 = 10（用户定案）；左右/下 8 */
        list-style: none;
        overflow-y: auto;
      }

      .todo-row {
        position: relative; /* 删除按钮右缘锚定基准（悬停向左展开、覆盖文字） */
        display: flex;
        align-items: center;
        gap: 10px;
        /* 霓虹勾选框装饰层（环/粒子）伸出行外且未勾选态也常驻（opacity:0 仍占滚动区），
           会给下方 overflow-y:auto 的分组容器制造 ~40px 幻影滚动区——裁剪回行界 */
        overflow: clip;
        padding: 9px 12px;
        border-radius: var(--radius-panel);
        background: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 玻璃板落影（REC 配方推广） */
        cursor: pointer;
      }

      /* 勾选框：uiverse hot-dragonfly-56（00Kubi，纯 CSS，R001 规范改造）
         颜色令牌化（glass.css --check-*）；原型交互 = 整行点击驱动，
         组件 pointer-events 关闭、input 仅作视觉状态位（勾选由 JS 置位后播过渡） */
      .neon-checkbox {
        --primary: var(--check-primary);
        --primary-dark: var(--check-primary-dark);
        --size: 20px; /* 原型行高适配（组件默认 30px） */
        position: relative;
        flex-shrink: 0;
        width: var(--size);
        height: var(--size);
        pointer-events: none;
        -webkit-tap-highlight-color: transparent;
      }

      .neon-checkbox input {
        display: none;
      }

      .neon-checkbox__frame {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .neon-checkbox__box {
        position: absolute;
        inset: 0;
        background: var(--check-box-bg);
        border-radius: 4px;
        border: 2px solid var(--primary-dark);
        transition: all 0.4s ease;
      }

      .neon-checkbox__check-container {
        position: absolute;
        inset: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .neon-checkbox__check {
        width: 80%;
        height: 80%;
        fill: none;
        stroke: var(--primary);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        transform-origin: center;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .neon-checkbox__glow {
        position: absolute;
        inset: -2px;
        border-radius: 6px;
        background: var(--primary);
        opacity: 0;
        filter: blur(8px);
        transform: scale(1.2);
        transition: all 0.4s ease;
      }

      .neon-checkbox__borders {
        position: absolute;
        inset: 0;
        border-radius: 4px;
        overflow: hidden;
      }

      .neon-checkbox__borders span {
        position: absolute;
        width: 40px;
        height: 1px;
        background: var(--primary);
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .neon-checkbox__borders span:nth-child(1) {
        top: 0;
        left: -100%;
        animation: borderFlow1 2s linear infinite;
      }

      .neon-checkbox__borders span:nth-child(2) {
        top: -100%;
        right: 0;
        width: 1px;
        height: 40px;
        animation: borderFlow2 2s linear infinite;
      }

      .neon-checkbox__borders span:nth-child(3) {
        bottom: 0;
        right: -100%;
        animation: borderFlow3 2s linear infinite;
      }

      .neon-checkbox__borders span:nth-child(4) {
        bottom: -100%;
        left: 0;
        width: 1px;
        height: 40px;
        animation: borderFlow4 2s linear infinite;
      }

      .neon-checkbox__particles span {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--primary);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        top: 50%;
        left: 50%;
        box-shadow: 0 0 6px var(--primary);
      }

      .neon-checkbox__rings {
        position: absolute;
        inset: -20px;
        pointer-events: none;
      }

      .neon-checkbox__rings .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid var(--primary);
        opacity: 0;
        transform: scale(0);
      }

      .neon-checkbox__sparks span {
        position: absolute;
        width: 20px;
        height: 1px;
        background: linear-gradient(90deg, var(--primary), transparent);
        opacity: 0;
      }

      /* 悬停态（原型整行点击驱动 + pointer-events 关闭，此态不触发，保留组件原样） */
      .neon-checkbox:hover .neon-checkbox__box {
        border-color: var(--primary);
        transform: scale(1.05);
      }

      /* 勾选态 */
      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__box {
        border-color: var(--primary);
        background: var(--check-box-bg-checked);
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__check {
        stroke-dashoffset: 0;
        transform: scale(1.1);
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__glow {
        opacity: 0.2;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__borders span {
        opacity: 1;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__particles span {
        animation: particleExplosion 0.6s ease-out forwards;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__rings .ring {
        animation: ringPulse 0.6s ease-out forwards;
      }

      .neon-checkbox input:checked ~ .neon-checkbox__frame .neon-checkbox__sparks span {
        animation: sparkFlash 0.6s ease-out forwards;
      }

      @keyframes borderFlow1 {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(200%);
        }
      }

      @keyframes borderFlow2 {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(200%);
        }
      }

      @keyframes borderFlow3 {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-200%);
        }
      }

      @keyframes borderFlow4 {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-200%);
        }
      }

      @keyframes particleExplosion {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--x, 20px)), calc(-50% + var(--y, 20px))) scale(0);
          opacity: 0;
        }
      }

      @keyframes ringPulse {
        0% {
          transform: scale(0);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @keyframes sparkFlash {
        0% {
          transform: rotate(var(--r, 0deg)) translateX(0) scale(1);
          opacity: 1;
        }
        100% {
          transform: rotate(var(--r, 0deg)) translateX(30px) scale(0);
          opacity: 0;
        }
      }

      .neon-checkbox__particles span:nth-child(1) {
        --x: 25px;
        --y: -25px;
      }
      .neon-checkbox__particles span:nth-child(2) {
        --x: -25px;
        --y: -25px;
      }
      .neon-checkbox__particles span:nth-child(3) {
        --x: 25px;
        --y: 25px;
      }
      .neon-checkbox__particles span:nth-child(4) {
        --x: -25px;
        --y: 25px;
      }
      .neon-checkbox__particles span:nth-child(5) {
        --x: 35px;
        --y: 0px;
      }
      .neon-checkbox__particles span:nth-child(6) {
        --x: -35px;
        --y: 0px;
      }
      .neon-checkbox__particles span:nth-child(7) {
        --x: 0px;
        --y: 35px;
      }
      .neon-checkbox__particles span:nth-child(8) {
        --x: 0px;
        --y: -35px;
      }
      .neon-checkbox__particles span:nth-child(9) {
        --x: 20px;
        --y: -30px;
      }
      .neon-checkbox__particles span:nth-child(10) {
        --x: -20px;
        --y: 30px;
      }
      .neon-checkbox__particles span:nth-child(11) {
        --x: 30px;
        --y: 20px;
      }
      .neon-checkbox__particles span:nth-child(12) {
        --x: -30px;
        --y: -20px;
      }

      .neon-checkbox__sparks span:nth-child(1) {
        --r: 0deg;
        top: 50%;
        left: 50%;
      }
      .neon-checkbox__sparks span:nth-child(2) {
        --r: 90deg;
        top: 50%;
        left: 50%;
      }
      .neon-checkbox__sparks span:nth-child(3) {
        --r: 180deg;
        top: 50%;
        left: 50%;
      }
      .neon-checkbox__sparks span:nth-child(4) {
        --r: 270deg;
        top: 50%;
        left: 50%;
      }

      .neon-checkbox__rings .ring:nth-child(1) {
        animation-delay: 0s;
      }
      .neon-checkbox__rings .ring:nth-child(2) {
        animation-delay: 0.1s;
      }
      .neon-checkbox__rings .ring:nth-child(3) {
        animation-delay: 0.2s;
      }

      .t-text {
        flex: 1;
        /* 右侧预留收起态删除按钮位（25px，收起左缘距行右缘 36px）；悬停展开时按钮再覆盖上来 */
        padding-right: 36px;
        font-size: 13.5px;
        line-height: 1.35;
        word-break: break-word;
      }

      .is-done .t-text {
        text-decoration: line-through;
        opacity: 0.55;
      }

      /* 删除按钮：uiverse smart-emu-83 改造（R001 规范，类名隔离 .del/.del-icon）
         实底改 25% 透明黑（用户定案）；整套按组件 0.5 等比缩放（25px，用户定案：原组件的一半）；
       中心缩放：收起位 right:11px（圆心 23.5px），悬停展宽向两侧各涨 5px——translateX(+5px)
       补偿右缘锚定，展开后右缘落回 right:6px（用户定案 ②） */
      .del {
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        transform: translateY(-50%);
        z-index: 1;
        display: flex;
        width: 25px;
        height: 25px;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 50%;
        background-color: rgba(0, 0, 0, 0.25);
        font-weight: 600;
        cursor: pointer;
        transition-duration: 0.3s;
        overflow: hidden;
      }

      .del-icon {
        width: 6px;
        transition-duration: 0.3s;
      }

      .del-icon path {
        fill: #fff;
      }

      .del:hover {
        width: 35px;
        transform: translateY(-50%) translateX(5px);
        border-radius: 50px;
        background-color: rgb(255, 69, 69);
        /* 红辉光：分层与浓度参数抄 input 聚焦紫辉光（--del-hover-glow） */
        box-shadow:
          0 10px 15px -3px var(--del-hover-glow),
          0 4px 6px -4px var(--del-hover-glow);
      }

      .del:hover .del-icon {
        width: 25px;
        transform: translateY(60%);
      }

      .del::before {
        position: absolute;
        top: -10px;
        content: "Delete";
        color: #fff;
        font-size: 2px;
        transition-duration: 0.3s;
      }

      .del:hover::before {
        font-size: 6.5px;
        opacity: 1;
        transform: translateY(15px);
        transition-duration: 0.3s;
      }

      /* 左上角归档按钮（功能 = 收拢/展开"已完成"，用户定案）：布局移植自 uiverse slippery-fox-79
         （vinodjangid07，MIT），位置距上/左 10px。两点适配：① position:absolute 落位卡角；
         ② 气泡翻转到按钮下方弹出——原组件在上方（top:-40px），会被卡片 overflow:hidden 裁掉。
         图形换 Bootstrap Icons archive（收拢语义）；#B5BAC1 填色 + 同色描边加粗（用户定案），悬停翻白 */
      .deleteButton {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2; /* 盖过标题粒子画布（画布 pointer-events:none，仅绘制层级） */
        width: 20px; /* 原组件 40px 的 50%（用户定案） */
        height: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background-color: transparent;
        border: none;
        border-radius: 4px; /* 随 50% 缩放（原 8px） */
        cursor: pointer;
        transition: all 0.2s;
        overflow: hidden;
      }

      .deleteButton svg {
        width: 10px; /* 固定 10px（用户定案；高按 50:59 原比例 ≈ 11.8px） */
      }

      .deleteButton:hover {
        background-color: #1e90ff; /* 悬停底色改 DodgerBlue（用户定案，原组件红 rgb(237,56,56)） */
        overflow: visible; /* 气泡可溢出按钮框（卡片裁剪已由下方弹出规避） */
      }

      .bin path {
        transition: all 0.2s;
      }

      .deleteButton:hover .bin path {
        fill: #fff; /* 悬停全白：填色 + 描边一起翻（描边留灰会残留灰边框，用户定案全白） */
        stroke: #fff;
      }

      .deleteButton.open {
        background-color: #1e90ff; /* 归档板打开期间保持蓝底（用户定案：开时保持、收板经 0.2s 褪去） */
        overflow: visible;
      }

      .deleteButton.open .bin path {
        fill: #fff; /* 图标随板开保持全白，收板褪回 #B5BAC1 */
        stroke: #fff;
      }

      .deleteButton:active {
        transform: scale(0.98);
      }

      .tooltip {
        --tooltip-color: rgba(
          0,
          0,
          0,
          0.25
        ); /* 25% 黑透（用户定案，原 rgb(41,41,41) 实底）；箭头同 var 联动 */
        position: absolute;
        top: calc(100% + 4px); /* 翻转到下方（原组件在上方，被卡片裁剪）；间距 4px（用户定案） */
        background-color: var(--tooltip-color);
        color: white;
        /* 气泡 = 原组件的 1/2（用户定案：字号 6px）：字号 12→6、内边距 8/12→4/6、圆角 5→2.5、阴影 10→5 */
        border-radius: 2.5px;
        font-size: 6px;
        padding: 4px 6px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0px 5px 5px rgba(0, 0, 0, 0.105);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.5s;
        pointer-events: none; /* 气泡不拦鼠标，移向气泡不闪断 hover */
      }

      .tooltip::before {
        position: absolute;
        content: "";
        left: 50%;
        top: -4px; /* 三角整体悬在气泡上缘外：菱形方块与气泡重叠会叠出一层黑透（用户定案换三角） */
        transform: translateX(-50%);
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-bottom: 5px solid var(--tooltip-color); /* 指向上方按钮的实心三角 */
      }

      .deleteButton:hover .tooltip {
        opacity: 1;
      }

      /* 归档板 = 卡片同款玻璃卡（用户定案）：glass-bg 纱底 + 玻璃描边/棱光/落影整套配方，磨砂 3px。
         揭示动画只能用 transform scale——clip-path 加在玻璃本体上磨砂层不吃逐帧裁切（瞬跳），
         加在父层上会切割 backdrop 采样范围（毛玻璃失效），两条路均被 Chromium 渲染层合并否决；
         scale 加在玻璃自身则磨砂与动画兼得，origin 定在归档图标中心即"从图案处飞出"。
         左右下各留 14px、上越页签顶 4px（用户定案：18px 基础外扩 4px） */
      #board-overlay {
        position: absolute;
        top: 54px; /* 兜底值：开板时 JS 按页签实测再上扩 4px 覆盖 */
        left: 14px;
        right: 14px;
        bottom: 14px;
        z-index: 1;
        color: var(--ink);
        visibility: hidden;
        transition: visibility 0s linear 0.4s; /* 收板时等玻璃缩完再隐 */
      }

      #board-overlay.open {
        visibility: visible;
        transition: none;
      }

      /* 玻璃本体层：卡片同款配方整套 + 3px 磨砂；从归档图标中心缩放飞出（带轻微回弹） */
      .board-glass {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 12px;
        overflow-y: auto;
        border-radius: var(--radius-board);
        background: var(--glass-bg);
        /* 贴边落影对齐页签家族（--panel-shadow，14px 缝里也可见，用户定案）；candy 留作环境柔影垫底 */
        box-shadow: var(--glass-stroke), var(--rim-light), var(--panel-shadow), var(--shadow-candy);
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
        transform-origin: var(--archive-x, 6px) var(--archive-y, -34px);
        transform: scale(0);
        /* 收板曲线在基础态（目的地态取曲线）：平缓缩回——复用回弹曲线会令 scale 越过 0
           变负值、以图标为轴镜像闪动（2026-09-18 目验发现，用户确认修） */
        transition: transform 0.35s ease;
      }

      #board-overlay.open .board-glass {
        transform: scale(1);
        transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1); /* 开板保留轻微回弹 */
      }

      .board-title {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0.85;
      }

      .board-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .empty,
      .placeholder {
        margin: 24px 0;
        font-size: 13px;
        text-align: center;
        opacity: 0.55;
      }

      /* 气泡页（BubblesView） */
      .actions {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 8px;
      }

      .capture {
        flex: 1;
        padding: 8px 0;
        border: none;
        border-radius: var(--radius-panel);
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .copied {
        flex-shrink: 0;
        font-size: 12px;
        opacity: 0.7;
      }

      .error {
        margin: 0;
        font-size: 12px;
        color: var(--danger);
      }

      .banner {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        border-radius: var(--radius-panel);
        background: rgba(230, 170, 0, 0.15);
        font-size: 12.5px;
      }

      .clear {
        flex-shrink: 0;
        padding: 4px 10px;
        border: none;
        border-radius: 8px;
        background: rgba(229, 72, 77, 0.15);
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .clear.confirming {
        background: var(--danger);
        color: #fff;
      }

      .bubble-row {
        position: relative; /* 删除按钮右缘锚定基准（.del 绝对定位的宿主要求，与 .todo-row 同款） */
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: var(--radius-panel);
        background: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow); /* 玻璃板落影（REC 配方推广） */
        cursor: pointer;
      }

      .b-text {
        flex: 1;
        /* 右侧预留收起态删除按钮位（收起左缘距行右缘 36px，与 .t-text 同款）；悬停展开时按钮覆盖上来 */
        padding-right: 36px;
        font-size: 13px;
        line-height: 1.35;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* 白板页（WhiteboardView） */
      .board {
        flex: 1;
        min-height: 0;
        padding: 10px 12px;
        border: none;
        border-radius: var(--radius-panel);
        background: var(--panel-bg);
        box-shadow: var(--panel-stroke), var(--panel-shadow);
        color: inherit;
        font: inherit;
        font-size: 13px;
        line-height: 1.5;
        resize: none;
        outline: none;
        word-break: break-word;
      }

      .board::placeholder {
        color: var(--ink-2);
      }

      .status {
        margin: 0;
        font-size: 12px;
        opacity: 0.55;
      }

      /* 实验场控件（design/ 专属，不映射 APP） */
      /* 实验场控件（design/ 专属，不映射 APP）：与玻璃板同宽，置于板下 */
      .lab {
        width: 300px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 12.5px;
        line-height: 1.6;
        backdrop-filter: blur(8px);
      }

      .lab h2 {
        margin: 0 0 8px;
        font-size: 13px;
      }

      /* 分支版本定位（用户定案：标题后空开几格） */
      .branch-ver {
        margin-left: 16px;
        font-size: 10.5px;
        opacity: 0.65;
      }

      /* 四按钮单行排布（flex 平分），压低面板高度 */
      .btnrow {
        display: flex;
        gap: 4px;
        margin: 4px 0;
      }

      .lab button {
        flex: 1;
        min-width: 0;
        padding: 5px 2px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: inherit;
        font-size: 11px;
        white-space: nowrap;
        text-align: center;
        cursor: pointer;
      }

      /* 主题按钮独占下一行（其余四钮单行排布） */
      #lab-theme {
        display: block;
        width: 100%;
        margin-top: 6px;
      }

      .lab button:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .lab .tip {
        margin: 8px 0 0;
        font-size: 11px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body data-bg="cafe">
    <div class="stage">
      <main class="glass-card" id="board">
        <header class="topbar">
          <h1 class="title">
            CapsuleTODO<canvas class="title-canvas" aria-hidden="true"></canvas>
          </h1>
        </header>
        <nav class="tabs">
          <input type="radio" id="radio-1" name="tabs" data-page="todos" checked />
          <label for="radio-1" class="tab">清单</label>
          <input type="radio" id="radio-2" name="tabs" data-page="bubbles" />
          <label for="radio-2" class="tab"
            >气泡<span id="bubble-badge" class="notification" hidden>0</span></label
          >
          <input type="radio" id="radio-3" name="tabs" data-page="whiteboard" />
          <label for="radio-3" class="tab">白板</label>
          <span class="glider"></span>
        </nav>

        <!-- 清单页 -->
        <div class="page" id="page-todos">
          <div class="addbar">
            <div class="row">

        <!-- 气泡页 -->
        <div class="page" id="page-bubbles" hidden>

        <!-- 归档板：已完成条目在此管理（勾选退回清单 / 删除彻底移除），盖住页签与三页内容（用户定案）。
             外层做揭示动画，玻璃本体在内层 .board-glass（分层原因见样式注释） -->
        <div id="board-overlay">

             （vinodjangid07，MIT），位置距上/左 10px；图形为 Bootstrap Icons archive（#B5BAC1+描边加粗） -->
        <button class="deleteButton" id="card-archive" aria-label="Archive">
          <svg
            xmlns="http://www.w3.org/2000/svg"

          >

              fill="#B5BAC1"

              stroke-width="1"

              d="M0 2a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1v7.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 1 12.5V5a1 1 0 0 1-1-1zm2 3v7.5A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5V5zm13-3H1v2h14zM5 7.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5"
            ></path>

      </main>

      <!-- 实验场控件（design/ 专属，不映射 APP） -->
      <aside class="lab">
        <h2>实验场控件<span class="branch-ver">ui1.0 V0.002</span></h2>
        <div class="btnrow">

          = DWM Acrylic，见 README 可行性标注）。定稿后按映射表落回 ui/（后续单独 PL）。

    <script>
      // ===== 客户端模拟状态（实验场专用：无 Tauri 无持久化，演示捕获 = 示例片段池） =====
      let todoSeq = 0;
      const todos = [
        { id: ++todoSeq, text: "买牛奶", done: false },
        { id: ++todoSeq, text: "写周报", done: false },
        { id: ++todoSeq, text: "读一章 Rust 书", done: false },
        { id: ++todoSeq, text: "给 CapsuleTODO 画个图标", done: true },
      ];
      let bubbleSeq = 0;
      const bubbles = [
        { id: ++bubbleSeq, text: "示例片段：把设计实验场的配方读数抄回 glass.css" },
        { id: ++bubbleSeq, text: "示例片段：uiverse 动效候选 R001-5 成功对勾曲线" },
      ];
      const SAMPLE_SNIPPETS = [
        "示例片段：随手复制的一段网址 https://example.com/design-lab",
        "示例片段：临时记一下——明早把白板草稿誊进待办",
        "示例片段： conferences 关键词清单，稍后整理",
      ];
      const MAX_BUBBLES = 5; // 与 APP 常量一致（满 5 提醒）
      let confirmingClear = false;
      let confirmTimer = 0;
      let copiedTimer = 0;
      let wbTimer = 0;
      let wbSaved = "";
      let snippetIdx = 0;

      const $ = (id) => document.getElementById(id);

      // ===== 页签（uiverse glider 组件：radio 驱动滑块，change 同步页面显隐） =====
      document.querySelectorAll('.tabs input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          for (const page of ["todos", "bubbles", "whiteboard"]) {
            $(`page-${page}`).hidden = page !== radio.dataset.page;
          }
        });
      });

      // ===== 清单与归档板共用行模板（is-done 勾选态由数据驱动） =====
      const todoRowHtml = (t) => `
          <li class="todo-row ${t.done ? "is-done" : ""}" data-id="${t.id}">
            <div class="neon-checkbox" aria-hidden="true">
              <input type="checkbox" tabindex="-1" ${t.done ? "checked" : ""} />
              <div class="neon-checkbox__frame">
                <div class="neon-checkbox__box">
                  <div class="neon-checkbox__check-container">
                    <svg class="neon-checkbox__check" viewBox="0 0 24 24">
                      <path d="M5 12l5 5L20 7"></path>
                    </svg>
                  </div>
                  <div class="neon-checkbox__glow"></div>
                  <div class="neon-checkbox__borders">
                    <span></span><span></span><span></span><span></span>
                  </div>
                </div>
                <div class="neon-checkbox__particles">
                  <span></span><span></span><span></span><span></span><span></span><span></span
                  ><span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="neon-checkbox__rings">
                  <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                </div>
                <div class="neon-checkbox__sparks">
                  <span></span><span></span><span></span><span></span>
                </div>
              </div>
            </div>
            <span class="t-text">${t.text}</span>
            <button class="del" data-del="${t.id}" aria-label="删除">
              <svg class="del-icon" viewBox="0 0 448 512">
                <path
                  d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.4 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"
                ></path>
              </svg>
            </button>
          </li>`;

      function renderTodos() {
        $("todo-active").innerHTML = todos
          .filter((t) => !t.done)
          .map(todoRowHtml)
          .join("");
        updateTodoChrome();
      }

      // 归档板渲染：已完成条目陈列（勾选退回清单 / 删除彻底移除）
      function renderBoard() {
        const done = todos.filter((t) => t.done);
        $("archive-list").innerHTML = done.map(todoRowHtml).join("");
        $("archive-empty").hidden = done.length > 0;
        $("archive-count").textContent = String(done.length);
      }

      // 空态外壳（未完成条目驱动；"已完成"已迁入归档板）
      function updateTodoChrome() {
        const undone = todos.filter((t) => !t.done).length;
        $("todo-empty").hidden = undone > 0;
        $("todo-active").hidden = undone === 0;
      }

      $("todo-add").addEventListener("click", addTodo);
      $("todo-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTodo();
      });
      $("todo-input").addEventListener("input", (e) => {
        $("todo-add").disabled = e.target.value.trim().length === 0;
      });

      function addTodo() {
        const text = $("todo-input").value.trim();
        if (!text) return;
        todos.push({ id: ++todoSeq, text, done: false });
        $("todo-input").value = "";
        $("todo-add").disabled = true;
        renderTodos();
      }

      document.addEventListener("click", (e) => {
        const del = e.target.closest("[data-del]");
        if (del) {
          const id = Number(del.dataset.del);
          // 先查气泡再查清单：两类行共用 data-del 删除通道，命中谁删谁
          const bi = bubbles.findIndex((x) => x.id === id);
          if (bi >= 0) {
            bubbles.splice(bi, 1);
            renderBubbles();
            return;
          }
          const idx = todos.findIndex((t) => t.id === id);
          if (idx >= 0) todos.splice(idx, 1);
          renderTodos();
          renderBoard(); // 板内彻底删除时同步收敛
          return;
        }
        const row = e.target.closest(".todo-row");
        if (row) {
          const t = todos.find((x) => x.id === Number(row.dataset.id));
          if (!t) return;
          // 板内行：仅勾选框生效——退回清单（用户定案）；点文字不动作
          if (row.closest("#board-overlay")) {
            if (!e.target.closest(".neon-checkbox")) return;
            t.done = false;
            renderBoard();
            renderTodos();
            return;
          }
          // 清单行：勾选即入档——动效就地播放（组件靠 :checked 过渡，整页重渲染会打断），播完离场
          t.done = true;
          row.querySelector(".neon-checkbox input").checked = true;
          row.classList.add("is-done");
          clearTimeout(row._moveTimer);
          row._moveTimer = setTimeout(() => {
            // 全量重渲染/删除会换掉节点，已脱离文档则跳过
            if (row.isConnected) {
              renderTodos();
              renderBoard();
            }
          }, 600);
          return;
        }
        const brow = e.target.closest(".bubble-row");
        if (brow) {
          // 复制回剪贴板（实验场尽力而为：非 https 环境可能被拒，观感不受影响）
          const b = bubbles.find((x) => x.id === Number(brow.dataset.id));
          if (b && navigator.clipboard) {
            navigator.clipboard.writeText(b.text).catch(() => {});
          }
          showCopied();

      });

      // ===== 归档板开关（用户定案双出口：再点归档图标 / 点板空白处收回） =====
      const boardOverlay = $("board-overlay");

        if (open) {
          // top 动态落位：页签顶再上扩 4px（用户定案）；归档图标中心的板内坐标注入 transform-origin
          // 变量（板左缘 14px，图标中心卡内 x=20 → 板内 x=6）
          const cr = $("board").getBoundingClientRect();
          const tr = document.querySelector(".tabs").getBoundingClientRect();

      document.addEventListener("click", (e) => {

      // ===== 气泡（捕获/复制回/删除/满 5 横幅/二态清空） =====
      function renderBubbles() {
        $("bubble-list").innerHTML = bubbles
          .map(

                  d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.4 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"

        $("bubble-badge").textContent = bubbles.length > 9 ? "9+" : String(bubbles.length);

      function showCopied() {

      // 演示捕获：示例片段池轮转（真实剪贴板链路属 APP，实验场只管观感）
      $("bubble-capture").addEventListener("click", () => {

      $("bubble-clear").addEventListener("click", () => {

      // ===== 白板（防抖自动保存状态行——实验场仅模拟状态，不落盘） =====

      // ===== 实验场控件：主题三态 / 背景切换 / 聚焦态预览 =====
      const themeStates = [
        { label: "跟随系统", value: null },

      $("lab-focus").addEventListener("click", () => {
        const on = $("board").classList.toggle("focused");
        $("lab-focus").textContent = `聚焦预览：${on ? "开" : "关"}`;
      });

      renderTodos();
      renderBubbles();

      // ===== 标题粒子化（参考 Da0Mine/text-particleization，MIT；CT 版改造：局部画布 / accent 色 /
      // clearRect 无拖尾 / 2x 采样密度 / reduced-motion 守卫 / 静止自动停帧省 GPU） =====
      function initTitleParticles() {
        const h1 = document.querySelector(".title");
        if (!h1) return null;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
        const canvas = h1.querySelector(".title-canvas");
        const ctx = canvas.getContext("2d");
        const card = h1.closest(".glass-card");
        const tabs = document.querySelector(".tabs");
        h1.classList.add("title--particles"); // 仅粒子形态：原文字透明让位（用户定案）
        const TEXT = "CapsuleTODO";
        const GAP = 2; // 采样步长（离屏像素）
        const REPEL_RADIUS = 55; // 排斥半径（收敛方案，用户定案）
        const REPEL_FORCE = 0.45;
        const SPRING = 0.06; // 回弹比排斥更快耗尽，扰动不拖尾（收敛方案）
        const FRICTION = 0.85;
        const MAX_OFFSET = 15; // 位移软钳制半径：离 home 超限即投影回球面（用户定案）
        const SETTLE_DIST = 0.5; // 最远粒子距 home 低于此且鼠标远离 → 吸附归位并停帧
        const FRAME_CAP = 240; // 硬上限：超时强制收尾（鼠标远离前提下）
        const MARGIN_X = 30;
        const MARGIN_TOP = 20; // 上余量：辉光上摆（模糊 15）+ 粒子散开；与 .title-canvas top:-20px 联动
        const MARGIN_BOTTOM = 30; /* 下余量：辉光下摆（偏移10+模糊15）+ 粒子散开不侵页签 */
        let particles = [];
        let dpr = 1;
        let raf = 0;
        let rect = null; // 标题视口坐标缓存（resize/scroll 刷新）
        let mouse = { x: -9999, y: -9999 }; // 画布坐标系，-9999 = 远离
        let frames = 0; // 周期帧计数：每轮动画独立起算（build 重建 / 出区弹回各归零），240 帧兜底只对本轮生效
        let zone = null; // 唤醒区（页面坐标矩形）：卡左右缘 × 卡顶→页签顶，随 build/scroll 刷新
        let shadow = { x: 1.7, y: 1.7, blur: 8, alpha: 0.35 }; // 落影参数：build 时从 --panel-shadow 令牌解析
        let glowColor = "rgba(192, 176, 253, 0.35)"; // 辉光色：build 时从 --input-focus-glow 令牌解析（回退 accent 35%）
        const GLOWS = [
          { x: 0, y: 10, blur: 15, spread: 3 },
          { x: 0, y: 4, blur: 6, spread: 4 },
        ]; /* 输入框聚焦辉光同款两层（外晕+近光）：spread = 配方负收缩，只采距缘足够深的点 */
        const SHADOW_THICK = 1.5; // 影子点在粒子半径上加粗的量：模糊后更厚实（用户定案）
        const sCan = document.createElement("canvas"); // 影层离屏：同坐标暗点整层模糊后垫底，随粒子位移
        const sctx = sCan.getContext("2d");

        const accent = () =>
          (
            getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#7c3aed"
          ).trim();

        // 离屏 2x 采样：30px 绘制文字 → alpha>128 网格扫描 → 粒子（home = 字形坐标）
        function build() {
          frames = 0; // 重建即新周期：重聚动画重新获得完整兜底预算，不继承上一轮累计
          rect = h1.getBoundingClientRect();
          const cr = card.getBoundingClientRect();
          const tr = tabs.getBoundingClientRect();
          zone = { left: cr.left, right: cr.right, top: cr.top, bottom: tr.top };
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          const cw = rect.width + MARGIN_X * 2;
          const ch = rect.height + MARGIN_TOP + MARGIN_BOTTOM;
          canvas.width = Math.round(cw * dpr);
          canvas.height = Math.round(ch * dpr);
          canvas.style.width = `${cw}px`;
          canvas.style.height = `${ch}px`;
          sCan.width = canvas.width;
          sCan.height = canvas.height;
          // 落影/辉光参数取自令牌（单一来源，随主题换色自动跟随）；解析失败回退基准值
          const cs = getComputedStyle(document.documentElement);
          const raw = cs.getPropertyValue("--panel-shadow");
          const dims = raw.match(/([\d.]+)px\s+([\d.]+)px\s+([\d.]+)px/);
          const a = raw.match(/,\s*([\d.]+)\)/);
          shadow = dims
            ? {
                x: Number(dims[1]),
                y: Number(dims[2]),
                blur: Number(dims[3]),
                alpha: a ? Number(a[1]) : 0.35,
              }
            : { x: 1.7, y: 1.7, blur: 8, alpha: 0.35 };
          glowColor = cs.getPropertyValue("--input-focus-glow").trim() || glowColor;
          // 采样参数取自标题实际样式：加粗/放大自动落到粒子上（用户定案）
          const style = getComputedStyle(h1);
          const cssFont = parseFloat(style.fontSize) || 15;
          const cssWeight = style.fontWeight || "700";
          const sampleFont = cssFont * 2; // 2 倍采样：渲染减半呈现，密度翻倍
          const font = `${cssWeight} ${sampleFont}px "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", sans-serif`;
          const off = document.createElement("canvas");
          const octx = off.getContext("2d", { willReadFrequently: true });
          octx.font = font;
          const tw = octx.measureText(TEXT).width;
          off.width = Math.ceil(tw + 8);
          off.height = Math.ceil(sampleFont * 1.5);
          octx.font = font; // 重设尺寸会重置上下文，需再赋一次
          octx.textBaseline = "middle";
          octx.fillStyle = "#fff";
          octx.fillText(TEXT, 4, off.height / 2);
          const data = octx.getImageData(0, 0, off.width, off.height).data;
          const scale = rect.width / tw; // 粒子字形精确铺满标题宽（≈0.5，即 2x 采样）
          const midY =
            MARGIN_TOP +
            rect.height / 2; /* 字形中心随盒：line-height 1 后墨迹顶≈盒顶=18（用户定案） */
          // 格点全集先收集：逐环外扩查空格可得每点到字形边缘的距离（1 格 ≈ 1 CSS px）
          const dots = new Set();
          for (let y = 0; y < off.height; y += GAP)
            for (let x = 0; x < off.width; x += GAP)
              if (data[(y * off.width + x) * 4 + 3] > 128) dots.add(`${x},${y}`);
          particles = [];
          for (let y = 0; y < off.height; y += GAP) {
            for (let x = 0; x < off.width; x += GAP) {
              if (!dots.has(`${x},${y}`)) continue;
              // 到字形边缘距离（CSS px）：辉光负 spread = 轮廓内缩，采 ed ≥ spread 的点近似
              let ed = 5 * GAP * scale;
              outer: for (let ring = 1; ring <= 5; ring++) {
                for (let ny = y - ring * GAP; ny <= y + ring * GAP; ny += GAP) {
                  for (let nx = x - ring * GAP; nx <= x + ring * GAP; nx += GAP) {
                    const onRing =
                      Math.abs(nx - x) === ring * GAP || Math.abs(ny - y) === ring * GAP;
                    if (onRing && !dots.has(`${nx},${ny}`)) {
                      ed = ring * GAP * scale;
                      break outer;
                    }
                  }
                }
              }
              const hx = MARGIN_X + (x - 4) * scale;
              const hy = midY + (y - off.height / 2) * scale;
              // 开场：随机撒在标题周边，靠弹簧汇聚成字
              particles.push({
                hx,
                hy,
                x: hx + (Math.random() - 0.5) * 80,
                y: hy + (Math.random() - 0.5) * 40,
                vx: 0,
                vy: 0,
                ed,
              });
            }
          }
        }

        function frame() {
          frames++;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height); // 真清屏：玻璃上不留拖尾
          let maxHome = 0; // 本帧所有粒子离 home 的最大距离：聚拢判定用最远者（用户定案）
          for (const p of particles) {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.hypot(dx, dy);
            if (dist < REPEL_RADIUS && dist > 0.01) {
              const f = ((REPEL_RADIUS - dist) / REPEL_RADIUS) * REPEL_FORCE;
              p.vx += (dx / dist) * f;
              p.vy += (dy / dist) * f;
            }
            p.vx = (p.vx + (p.hx - p.x) * SPRING) * FRICTION;
            p.vy = (p.vy + (p.hy - p.y) * SPRING) * FRICTION;
            p.x += p.vx;
            p.y += p.vy;
            // 软钳制：开场 120 帧后启用，粒子无论被扫多狠，离 home 不超过 MAX_OFFSET（用户定案）
            const ddx = p.x - p.hx;
            const ddy = p.y - p.hy;
            const homeDist = Math.hypot(ddx, ddy);
            if (frames > 120 && homeDist > MAX_OFFSET) {
              p.x = p.hx + (ddx / homeDist) * MAX_OFFSET;
              p.y = p.hy + (ddy / homeDist) * MAX_OFFSET;
            }
            if (homeDist > maxHome) maxHome = homeDist;
          }
          paint(); // 影子层 + 粒子本体（影子随粒子位移同步，用户定案）
          // 静止自动停帧：最远粒子距 home < 0.5px 视作聚拢完成 → 吸附归位画出零残差终帧再休眠
          //（按最远而非均值：出区时仅光标附近一小簇散开，均值被未动粒子稀释后会误判"已聚拢"
          // 而首帧瞬移归位——2026-09-18 实测）；鼠标远离前提下本周期超 240 帧强制收尾。靠近/重建时唤醒
          const far = mouse.x < -999;
          if (far && (maxHome < SETTLE_DIST || frames > FRAME_CAP)) {
            for (const p of particles) {
              p.x = p.hx;
              p.y = p.hy;
              p.vx = 0; // 吸附同时清零速度：防唤醒首帧旧速度回放抖动（用户定案）
              p.vy = 0;
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 清掉旧帧残影再画终帧（用户定案）
            paint(); // 终帧同款绘制：影子随粒子归位（用户定案）
            raf = 0;
            return;
          }
          raf = requestAnimationFrame(frame);
        }

        // 影层统一管线：同坐标暗点（半径 = 粒子半径 + thick）落进离屏 → 整层一次模糊 → 叠到主画布
        //（设备像素空间整层模糊，半径按 dpr 放大，观感即 CSS px）
        function paintLayer(color, ox, oy, thick, blur, alpha, spread) {
          sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          sctx.clearRect(0, 0, canvas.width, canvas.height);
          sctx.fillStyle = color;
          for (const p of particles) {
            if (p.ed < spread) continue; // 负 spread：贴缘点不进辉光，等效轮廓内缩（box-shadow 语义）
            const r = 0.5 + Math.min(1, Math.hypot(p.vx, p.vy) / 3) * 0.4 + thick;
            sctx.beginPath();
            sctx.arc(p.x + ox, p.y + oy, r, 0, 6.2832);
            sctx.fill();
          }
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.filter = `blur(${blur * dpr}px)`;
          ctx.globalAlpha = alpha;
          ctx.drawImage(sCan, 0, 0);
          ctx.restore(); // 恢复变换/滤镜/透明度
        }

        // 影层 + 粒子本体一次画齐，叠序 = 旧 CSS 滤镜链：辉光两层 → 玻璃落影 → 粒子；
        // 全部同坐标暗点经离屏模糊，散开/弹回全程与粒子同步（用户定案）
        function paint() {
          for (const g of GLOWS) paintLayer(glowColor, g.x, g.y, 0, g.blur, 1, g.spread);
          paintLayer("#000", shadow.x, shadow.y, SHADOW_THICK, shadow.blur, shadow.alpha, 0);
          ctx.fillStyle = accent();
          for (const p of particles) {
            const disp = Math.min(1, Math.hypot(p.vx, p.vy) / 3); // 位移越大越大（不透明恒定，用户定案）
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 0.5 + disp * 0.4, 0, 6.2832); // 粒子基础半径 0.5（用户定案）
            ctx.fill();
          }
        }

        function wake() {
          if (!raf) raf = requestAnimationFrame(frame);
        }

        // 交互监听在 window：光标落在"卡宽 × 卡顶→页签顶"矩形（zone）内即唤醒并施加排斥，
        // 越界即视作远离（粒子弹回归位）。边界取自卡片/页签实测矩形，布局改动自动跟随
        const track = (clientX, clientY) => {
          if (!rect || !zone) return;
          const cx = clientX - rect.left + MARGIN_X;
          const cy = clientY - rect.top + MARGIN_TOP;
          const near =
            clientX >= zone.left &&
            clientX <= zone.right &&
            clientY >= zone.top &&
            clientY <= zone.bottom;
          if (!near) {
            mouse.x = -9999;
            mouse.y = -9999;
            frames = 0; // 出区弹回按新周期计帧：长时把玩后累计帧数超限，不清零则弹回首帧即被强制归位
            wake(); // 出区也唤醒：弹回归位动画必然播完，不残留散开态（用户定案）
            return;
          }
          mouse.x = cx;
          mouse.y = cy;
          wake();
        };
        window.addEventListener("mousemove", (e) => track(e.clientX, e.clientY), { passive: true });
        window.addEventListener(
          "touchmove",
          (e) => {
            if (e.touches.length) track(e.touches[0].clientX, e.touches[0].clientY);
          },
          { passive: true },
        );
        window.addEventListener("resize", () => {
          build();
          wake();
        });
        window.addEventListener(
          "scroll",
          () => {
            if (!rect) return;
            rect = h1.getBoundingClientRect(); // 视口坐标随滚动失效，仅刷新缓存
            const cr = card.getBoundingClientRect();
            const tr = tabs.getBoundingClientRect();
            zone = { left: cr.left, right: cr.right, top: cr.top, bottom: tr.top };
          },
          { passive: true },
        );

        build();
        wake(); // 开场汇聚动画
        return {
          refresh() {
            // 主题换色后重建（accent 随主题）
            build();
            wake();
          },
        };
      }

      const titleFX = initTitleParticles();
    </script>
  </body>
</html>
